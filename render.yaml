services:
  - type: web
    name: customer-churn-api
    runtime: python
    region: oregon
    rootDir: customer-churn-ml
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
